name: Fix recovered provider library CI

on:
  push:
    branches:
      - agent/provider-cross-posting
    paths:
      - .github/workflows/fix-provider-recovery-ci.yml

permissions:
  contents: write

concurrency:
  group: fix-provider-recovery-ci-evgl-libs
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: github.repository == 'evento-globolo/evgl-libs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/provider-cross-posting
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Rust and Clippy
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Apply the two compiler-directed fixes and run the full repository test script
        shell: bash
        run: |
          set -euo pipefail

          perl -0pi -e 's/return Err\(ProviderError::Remote \{ status: 422, body: errors\.to_string\(\) \}\);/return Err(ProviderError::Remote {\n                    status: 422,\n                    body: serde_json::to_string(errors)\n                        .unwrap_or_else(|_| "provider validation failed".to_owned()),\n                });/' \
            crates/evgl-providers/src/meetup.rs

          perl -0pi -e 's/expires_at: tokens\.expires_at\.clone\(\),/expires_at: tokens.expires_at,/' \
            crates/evgl-token-vault/src/lib.rs

          ! grep -Fq 'errors.to_string()' crates/evgl-providers/src/meetup.rs
          ! grep -Fq 'tokens.expires_at.clone()' crates/evgl-token-vault/src/lib.rs
          grep -Fq 'serde_json::to_string(errors)' crates/evgl-providers/src/meetup.rs
          grep -Fq 'expires_at: tokens.expires_at,' crates/evgl-token-vault/src/lib.rs

          cargo fmt --all
          ./scripts/test.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/evgl-providers/src/meetup.rs \
            crates/evgl-token-vault/src/lib.rs
          if [[ -f Cargo.lock ]]; then
            git add -f Cargo.lock
          fi
          git commit -m 'fix: serialize provider errors and satisfy Clippy' \
            -m 'Applies only the two exact-head compiler findings from the recovered provider workspace and records the resolved lockfile.'
          git push origin HEAD:agent/provider-cross-posting
