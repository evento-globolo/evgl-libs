[package]
org = "evento-globolo"
name = "evgl-libs"
version = "0.1.0"
description = "Shared contracts and runtime-light libraries for Evento Globolo"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/evento-globolo/evgl-libs"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "zed_modules/**", "target/**", "dist/**", "*.log"]

[scripts]
test = "bash scripts/test.sh"

[dependencies]
"evento-globolo/evgl-interfaces" = "^0.1.0"

[install]
dir = "zed_modules"
adapter = "rust"
